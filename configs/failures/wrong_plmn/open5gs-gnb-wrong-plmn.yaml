# Controlled wrong-PLMN configuration.
# This file intentionally changes only the gNB Mobile Network Code from the
# known-good value 70 to unsupported value 71. Do not use it as the baseline.

mcc: '999'          # Mobile Country Code value
mnc: '71'           # Intentional mismatch; baseline AMF serves MNC 70

nci: '0x000000010'  # NR Cell Identity (36-bit)
idLength: 32        # NR gNB ID length in bits [22...32]
tac: 1              # Tracking Area Code

linkIp: 127.0.0.1   # gNB local address for Radio Link Simulation
ngapIp: 127.0.0.1   # gNB local endpoint for the N2 interface
gtpIp: 127.0.0.1    # gNB local endpoint for the N3 interface

# Access and Mobility Management Function address information
amfConfigs:
  - address: 127.0.0.5
    port: 38412

# Single Network Slice Selection Assistance Information supported by the gNB
slices:
  - sst: 1

# Ignore SCTP stream number errors for simulator compatibility.
ignoreStreamIds: true

# Normal terrestrial New Radio access.
cellAccessType: nr
